name: scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build site
        run: |
          mkdir -p dist
          cp -r index.html css js assets dist/
      - name: scan
        env:
          OUT: dist/data
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STEAM_PAGES: 70
          VERIFY_MAX: 40
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: node scanner/scan.mjs
      - name: lock
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: node scanner/seal-dist.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
